<html lang="fr">
<head>

    .box {

    }
    h2 {
      color: red;
    }
    h3 {
      color: black;

<input type="radio" name="choix" id="radio2" value="2"> Casque
<input type="radio" name="choix" id="radio3" value="3"> Bluetooth <br><br>
<input type="password" value="azerty"><br><br>
<input type="range" min="0" max="100" value="50"> Volume <br>
</div>
    <input type="password" value="azerty"><br><br>    0 <br>
